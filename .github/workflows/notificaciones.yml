name: Enviar notificaciones

# Cada media hora avisa de las tareas recién asignadas, y en la mañana
# (8:00 en Ecuador) manda el resumen de vencimientos.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Que no se solapen dos envíos.
concurrency:
  group: notificaciones
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --omit=dev

      - name: Mandar los correos pendientes
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: node scripts/enviar-notificaciones.mjs
