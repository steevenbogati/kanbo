name: Publicar en GitHub Pages

# Publica la app cada vez que se sube algo a main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se suben dos cambios seguidos, se publica el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Revisar que no haya errores
        run: |
          npm run lint
          npm run typecheck

      - name: Construir la app
        env:
          # Estas dos son públicas por diseño: viajan en cualquier página web.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # GitHub Pages sirve el proyecto dentro de /kanbo/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Faltan las variables NEXT_PUBLIC_SUPABASE_URL y NEXT_PUBLIC_SUPABASE_ANON_KEY."
            echo "Agrégalas en Settings → Secrets and variables → Actions → pestaña Variables."
            exit 1
          fi
          npm run build

      # Sin este archivo, GitHub Pages ignora las carpetas que empiezan con _
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
